services:
  - type: web
    name: llm-gateway
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: LLM_GATEWAY_DATA_DIR
        value: "/var/data/llm-gateway"
    disk:
      name: llm-gateway-data
      mountPath: /var/data/llm-gateway
      sizeGB: 1
